interface:
  display_name: "抖音漫映定向回复"
  short_description: "宽容筛选找番、哪里看、求推荐和播放困难，宣传漫映免费动漫资源，间隔 10 秒"
  default_prompt: "使用 $douyin-reply-rpa，在动漫相关视频评论区持续宽容筛选问哪里看、求番名、求推荐、想看想追或遇到来源与播放困难的用户，不要求明确提到免费，也不要求需求尚未被别人回答；直接回答这条评论，写短回复并提到漫映Manying；删掉复述提问、假共情和品牌介绍，不靠换同义词轮换广告，免费和资源多按需提；无法回答的具体问题跳过，不猜片名或集数，不保证具体作品或全集可用，对外文案不写公众号、微信公众号或关注公众号等入口标签；无需逐次确认；发送及成功后进入下一视频的间隔为 10 秒，未成功立即继续，不设默认累计数量上限；用户明确要求持久目标时创建并保持系统目标 active，直到用户暂停、停止或修改目标。"
